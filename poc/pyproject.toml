[project]
name = "preamble-poc"
description = "Proof-of-concept implementation of the PREAMBLE VDAF"
version = "0.0.1"
requires-python = ">=3.12,<4"
dependencies = [
    "vdaf_poc @ git+https://github.com/cfrg/draft-irtf-cfrg-vdaf@draft-irtf-cfrg-vdaf-18#subdirectory=poc",
]

[dependency-groups]
dev = [
    "mypy==1.12.0",
    "mypy-extensions==1.0.0",
]

[tool.uv]
# The modules in this directory are imported as top-level scripts
# (`import preamble`), not as an installable package.
package = false
